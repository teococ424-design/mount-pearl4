<html>
<head>
  <link rel="stylesheet" href="css/transition.css">
</head>
<body>
<!-- ========================================= -->
<!-- CINEMATIC INTRO -->
<!-- Adaugă imediat după <body> -->
<!-- ========================================= -->

<div id="cinematicIntro">

  <!-- Cer -->
  <div class="intro-sky"></div>

  <!-- Glow central -->
  <div class="intro-light"></div>

  <!-- Ceață fundal -->
  <div class="fog fog-back-1"></div>
  <div class="fog fog-back-2"></div>

  <!-- Munți îndepărtați -->
  <div class="mountain-bg mountain-bg-left"></div>
  <div class="mountain-bg mountain-bg-right"></div>

  <!-- Ceață mijloc -->
  <div class="fog fog-middle-1"></div>
  <div class="fog fog-middle-2"></div>

  <!-- MUNȚII PRINCIPALI -->
  <div class="mountain mountain-left">

    <img
            src="mountain-left.png"
            alt=""
            draggable="false">

  </div>

  <div class="mountain mountain-right">

    <img
            src="mountain-right.png"
            alt=""
            draggable="false">

  </div>

  <!-- Ceață apropiată -->
  <div class="fog fog-front-1"></div>
  <div class="fog fog-front-2"></div>
  <div class="fog fog-front-3"></div>

  <!-- Lumină -->
  <div class="center-glow"></div>

  <!-- Overlay întunecat -->
  <div class="intro-vignette"></div>

</div>

<script src="js/transition.js"></script>

</body>
</html>
